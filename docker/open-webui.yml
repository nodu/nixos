# Open WebUI - ChatGPT-like interface for local models
# Connects to Unsloth Studio on the host (OpenAI-compatible, :8888), the local
# model server on the mac and the NixOS workstations. Open WebUI's built-in
# ollama connection is switched off.
#
# Studio's keyless access is loopback-only and requests from a container are
# not loopback, so Studio needs a real key: create one in Unsloth Studio
# (Settings > API) and export UNSLOTH_API_KEY before `up`.
#
# Document embeddings use Open WebUI's built-in model (downloaded on first
# start). To embed with a Studio model instead, switch the engine to OpenAI in
# Open WebUI's admin settings and point it at the same :8888/v1 URL.
#
# Usage:
#   docker compose -f docker/open-webui.yml up -d    # start
#   docker compose -f docker/open-webui.yml down      # stop
#   docker compose -f docker/open-webui.yml pull      # update image
#
# Open http://localhost:8080 in your browser.

services:
  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    container_name: open-webui
    ports:
      - "8080:8080"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - ENABLE_OLLAMA_API=false
      - OPENAI_API_BASE_URL=http://host.docker.internal:8888/v1
      - OPENAI_API_KEY=${UNSLOTH_API_KEY:-}
      - WEBUI_AUTH=false
    volumes:
      - open-webui:/app/backend/data
    restart: unless-stopped

volumes:
  open-webui:
